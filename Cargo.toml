[package]
name = "ipabuyer-core"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "IPAbuyer cross-platform core library"

[lib]
name = "ipabuyer_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = "0.4"
fancy-regex = "0.13"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
