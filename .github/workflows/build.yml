name: Build

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: 1.98.1
        components: clippy, rustfmt

    - name: Format
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Test
      run: cargo test --locked

  build:
    name: Build (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-pc-windows-msvc
          arch: amd64
        - target: aarch64-pc-windows-msvc
          arch: arm64
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: 1.98.1
        targets: ${{ matrix.target }}

    # aarch64 交叉编译时 ring 的 C 代码需要 clang（x64 runner 无 ARM64 MSVC 工具链）。
    - name: Install LLVM for arm64 cross-compile
      if: matrix.arch == 'arm64'
      run: choco install llvm -y

    - name: Build release DLL
      run: cargo build --release --locked --target ${{ matrix.target }}
      env:
        CC_aarch64_pc_windows_msvc: clang-cl
        CXX_aarch64_pc_windows_msvc: clang-cl

    - name: Organize artifacts
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        $name = "ipabuyer-core-$version-windows-${{ matrix.arch }}.dll"
        Copy-Item "target/${{ matrix.target }}/release/ipabuyer_core.dll" $name
        $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
        "$hash  $name" | Out-File "$name.sha256" -Encoding ascii -NoNewline
        Write-Host "$name`nSHA256: $hash"

    - uses: actions/upload-artifact@v7
      with:
        name: ipabuyer-core-windows-${{ matrix.arch }}
        path: |
          ipabuyer-core-*-windows-${{ matrix.arch }}.dll
          ipabuyer-core-*-windows-${{ matrix.arch }}.dll.sha256

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: List artifacts
      run: ls -la artifacts/

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        body: https://github.com/ipabuyer/IPAbuyer.Core/blob/main/CHANGELOG.md
        artifacts: "artifacts/*"
